name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Recuperar la llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64. Sin él no se puede firmar el APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/agenda.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/agenda.p12" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Nombrar el APK con su versión
        run: |
          V=$(grep '^VERSION=' version.properties | cut -d= -f2)
          echo "V=$V" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/AppAgenda-v$V.apk"
          # Solo se publica si esta versión todavía no existe (así una corrección sin subir versión no pisa la anterior).
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          else
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AppAgenda-v${{ env.V }}-build${{ github.run_number }}
          path: out/*.apk

      - name: Publicar versión
        if: github.ref == 'refs/heads/main' && env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: AppAgenda ${{ env.V }}
          make_latest: true
          body: |
            Versión ${{ env.V }} de tu agenda. Descarga AppAgenda-v${{ env.V }}.apk e instálala encima de la anterior: no se pierden tus datos.
          files: out/*.apk
